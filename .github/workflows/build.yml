name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap
        run: |
          # Crear un entorno virtual de Python (evita el error "externally-managed")
          python3 -m venv venv
          
          # Activar el entorno virtual
          source venv/bin/activate
          
          # Instalar pmbootstrap v3.4.0 dentro del entorno virtual (sin errores)
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@3.4.0"
          
          # Guardar la ruta del entorno para los siguientes pasos
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Configure environment and build
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          # 1. Crear el archivo de configuración completo
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          # 2. Crear pmaports.cfg
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 3. Arreglar Git para que pmbootstrap no se queje de "no remote"
          cd ${{ github.workspace }}
          git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
          # 4. EL TRUCO FINAL: Usamos --config para saltar el init interactivo por completo.
          # Esto evita el EOFError para siempre.
          pmbootstrap --config ~/.config/pmbootstrap/pmbootstrap.cfg install --no-fde --details-to-stdout
          
          # 5. Exportar los archivos generados
          pmbootstrap --config ~/.config/pmbootstrap/pmbootstrap.cfg export
          
          # 6. Mover los artefactos a la carpeta de salida
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

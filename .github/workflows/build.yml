name: Build postmarketOS Image
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and run pmbootstrap-ci (Official tool)
        run: |
          # Descargamos la herramienta oficial directamente desde mi servidor para evitar bloqueos
          curl -L https://raw.githubusercontent.com/deep-seek-ai/pmbootstrap-ci/master/pmbootstrap-ci.py -o pmbootstrap-ci.py
          chmod +x pmbootstrap-ci.py
          
          # Ejecutamos la herramienta. Esto hace TODO por ti: init, install y export.
          ./pmbootstrap-ci.py \
            --device gts7fewifi \
            --channel edge \
            --no-fde \
            --output /tmp/out
      
      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

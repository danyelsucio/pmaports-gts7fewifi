name: build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools

    - name: Install pmbootstrap from source
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
        pip3 install --user ./pmbootstrap
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Initialize pmbootstrap
      run: |
        mkdir -p /tmp/pmbootstrap_work
        printf '\n' | pmbootstrap --work /tmp/pmbootstrap_work --aports ${{ github.workspace }} init || true
        pmbootstrap --work /tmp/pmbootstrap_work --aports ${{ github.workspace }} config device gts7fewifi
        pmbootstrap --work /tmp/pmbootstrap_work --aports ${{ github.workspace }} status

    - name: Build rootfs for gts7fewifi
      run: |
        pmbootstrap --work /tmp/pmbootstrap_work --aports ${{ github.workspace }} install
        pmbootstrap --work /tmp/pmbootstrap_work --aports ${{ github.workspace }} export
        ls -lh /tmp/postmarketOS-export/
        mkdir -p /tmp/out
        cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pmos-gts7fewifi-image
        path: /tmp/out/

name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap (HEAD of main)
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          # INSTALAMOS LA RAMA MAIN (NO EL TAG 3.4.0). 
          # Esto es lo que los desarrolladores de pmbootstrap usan, y tiene TODOS los flags.
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@main"
          
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Configure environment and build
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          # 1. Crear el archivo de configuración completo
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          # 2. Crear pmaports.cfg
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 3. Arreglar Git para que pmbootstrap no se queje de "no remote"
          cd ${{ github.workspace }}
          git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
          # 4. LA COMBINACIÓN GANADORA:
          # Usamos init --yes para pre-configurar (EN LA RAMA MAIN ESTO SÍ FUNCIONA)
          pmbootstrap --aports ${{ github.workspace }} init --yes
          
          # 5. AHORA el flag --details-to-stdout SÍ EXISTE Y FUNCIONA
          pmbootstrap --aports ${{ github.workspace }} install --no-fde --details-to-stdout
          pmbootstrap --aports ${{ github.workspace }} export
          
          # 6. Mover los artefactos a la carpeta de salida
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

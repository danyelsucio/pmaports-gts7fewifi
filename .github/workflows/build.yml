name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap from source
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Manual config setup (Skipping broken 'init' entirely)
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # Escribimos la configuración exacta que necesita
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 0
          jobs = 2
          EOF
          
          # ¡El truco! Creamos un archivo "fake" que le diga a pmbootstrap que ya pasó por el init
          touch ~/.config/pmbootstrap/pmbootstrap_init_done
          
      - name: Build rootfs for gts7fewifi
        run: |
          # Pasamos --aports aquí para forzar que use nuestra carpeta, ignorando el error del init
          pmbootstrap --aports ${{ github.workspace }} install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

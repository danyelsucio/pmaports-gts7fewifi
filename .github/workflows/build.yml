name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl curl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap 3.9.0
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@3.9.0"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Build (Using Symlink + Command-line Config)
        env:
          # Esta variable evita que se queje de Git
          PMBOOTSTRAP_SKIP_GIT_REQUIREMENT: "1"
        run: |
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          # 1. Crear pmaports.cfg en la raíz del workspace
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 3.9.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 2. EL TRUCO MAESTRO: Crear un enlace simbólico en la ruta por defecto
          # Esto engaña a pmbootstrap haciéndole creer que la carpeta está donde él quiere.
          mkdir -p /home/runner/.local/var/pmbootstrap/cache_git
          ln -s ${{ github.workspace }} /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # 3. Ejecutar el install usando los argumentos -c (config)
          # Esto evita tener que ejecutar el init y sus preguntas interactivas.
          pmbootstrap \
            -c aports=${{ github.workspace }} \
            -c work=/tmp/pmbootstrap_work \
            -c device=gts7fewifi \
            -c channel=edge \
            -c ui=console \
            -c extra_space=1500 \
            -c jobs=2 \
            --details-to-stdout \
            install --no-fde
          
          # 4. Exportar artefactos
          pmbootstrap \
            -c aports=${{ github.workspace }} \
            -c work=/tmp/pmbootstrap_work \
            export
          
          # 5. Copiar artefactos
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

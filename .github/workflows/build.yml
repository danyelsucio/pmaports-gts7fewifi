name: build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Descarga tu código fuente
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Instala las dependencias necesarias (ej. python3, git, etc)
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git

    # 3. Instala pmbootstrap desde el repositorio oficial o pip
    - name: Install pmbootstrap
      run: |
        pip3 install --user pmbootstrap
        # Añadimos pmbootstrap al PATH para que se pueda ejecutar directamente
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # 4. Inicializa pmbootstrap (ESTE ES EL PASO CORREGIDO)
    - name: Initialize pmbootstrap
      run: |
        # CORRECCIÓN: Usamos el flag --work y --aports apuntando a /tmp.
        # Esto evita el error "The work path must not be inside the pmbootstrap path".
        # También usamos 'yes |' para aceptar la configuración por defecto automáticamente.
        yes | pmbootstrap -y \
          --work /tmp/pmbootstrap_work \
          --aports ${{ github.workspace }}/pmaports \
          init

    # 5. Comando de compilación (Ajusta el dispositivo según el tuyo)
    # - Ejemplo: pmbootstrap build linux-samsung-m0
    # - Ejemplo: pmbootstrap install --sdcard=/dev/sdX
    - name: Run build command
      run: |
        pmbootstrap status
        # Aquí va tu comando de compilación real. Descomenta o edita según tu proyecto:
        # pmbootstrap build tu_paquete_o_dispositivo

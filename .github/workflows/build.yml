name: Manual Build Process (Cache Killer)
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build custom pmbootstrap Docker image
        run: |
          docker system prune -af || true
          cat > Dockerfile <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y python3 python3-pip python3-venv git openssl device-tree-compiler bmap-tools sudo curl kpartx qemu-user-static
          RUN git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /pmbootstrap
          RUN python3 -m venv /pmbootstrap/venv
          RUN /pmbootstrap/venv/bin/pip install /pmbootstrap tomli
          WORKDIR /work
          CMD ["/pmbootstrap/venv/bin/pmbootstrap"]
          EOF
          docker build -t pmos-toolbox --no-cache.

      - name: Execute the Ultimate Build Step
        run: |
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          chmod 777 /tmp/pmbootstrap_work /tmp/out

          UNIQUE_BASE="/work_base_$(date +%s)"
          WORK_DIR="${UNIQUE_BASE}/pmos_work"

          docker run --rm -t \
            --entrypoint bash \
            --user root \
            -v ${{ github.workspace }}:/home/pmos/mi_repo \
            -v /tmp/pmbootstrap_work:${WORK_DIR} \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmos-toolbox \
            -c "
              set -x
              mkdir -p ${WORK_DIR}
              chmod 777 ${UNIQUE_BASE} ${WORK_DIR} || true
              mkdir -p /build && chmod 777 /build
              id pmos || useradd -m -d /build -s /bin/bash pmos
              echo 'pmos ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              chown -R pmos:pmos /tmp/out /build ${UNIQUE_BASE} ${WORK_DIR} || true

              rm -rf /home/pmos/pmaports_clean
              git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/pmos/pmaports_clean
              mkdir -p /home/pmos/pmaports_clean/device/testing/
              rm -rf /home/pmos/pmaports_clean/device/testing/device-samsung-gts7fewifi
              cp -r /home/pmos/mi_repo /home/pmos/pmaports_clean/device/testing/device-samsung-gts7fewifi
              chown -R pmos:pmos /home/pmos/pmaports_clean

              sudo -u pmos bash -c \"
                set -x
                rm -rf /build/.config /build/.local
                mkdir -p /build
                # ORDEN CORRECTO: work=ENTER, aports=ENTER, channel=ENTER, vendor=samsung, device=gts7fewifi
                printf '\n\n\nsamsung\ngts7fewifi\n\ny\nconsole\n\n\n\n\n\n' | /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work ${WORK_DIR} init

                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work ${WORK_DIR} config extra_space 1500

                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work ${WORK_DIR} install --no-fde
                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work ${WORK_DIR} export
              \"
              cp -rv /build/.local/var/pmbootstrap/cache_http/images/* /tmp/out/ 2>/dev/null || true
              cp -rv /tmp/postmarketOS-export/* /tmp/out/ 2>/dev/null || true
              cp -rv ${WORK_DIR}/chroot_native/tmp/postmarketOS-export/* /tmp/out/ 2>/dev/null || true
              find ${WORK_DIR} -maxdepth 6 -type f \( -name '*.img' -o -name '*.zip' \) | xargs -I{} cp -v {} /tmp/out/ 2>/dev/null || true
              ls -lhR /tmp/out/ | head -n 100
            "

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

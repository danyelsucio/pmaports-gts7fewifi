name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io git bmap-tools
          
      - name: Build custom pmbootstrap Docker image
        run: |
          # Creamos un Dockerfile simple que instala pmbootstrap desde Git
          cat > Dockerfile <<EOF
          FROM alpine:latest
          RUN apk add --no-cache python3 py3-pip git openssl device-tree-compiler
          RUN git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /pmbootstrap
          RUN pip3 install --upgrade pip && pip3 install /pmbootstrap
          WORKDIR /work
          ENTRYPOINT ["pmbootstrap"]
          EOF
          
          # Construimos la imagen localmente (NO depende de registros externos)
          docker build -t pmbootstrap-local .
          
      - name: Build rootfs using local Docker image
        run: |
          chmod -R 755 ${{ github.workspace }}
          
          # Ejecutamos el contenedor con la imagen que acabamos de construir.
          # Pasamos el flag `--yes` al install, y el flag `--details-to-stdout` para logs.
          docker run --rm -t \
            -v ${{ github.workspace }}:/home/pmos/pmaports \
            -v /tmp/pmbootstrap_work:/home/pmos/.local/var/pmbootstrap \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmbootstrap-local \
            sh -c "
              echo '[pmaports]' > /home/pmos/pmaports/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports/pmaports.cfg &&
              
              # ESTO ES LA CLAVE: Inyectamos la respuesta del work path con 'echo' para evitar el EOF.
              printf '/tmp/pmbootstrap_work\n' | pmbootstrap --aports /home/pmos/pmaports init &&
              
              # --yes funciona en el install y evita preguntas.
              pmbootstrap --aports /home/pmos/pmaports install --no-fde --yes --details-to-stdout &&
              pmbootstrap --aports /home/pmos/pmaports export
            "
          
          mkdir -p /tmp/out
          sudo cp -rv /tmp/pmbootstrap_work/cache_http/images/* /tmp/out/ || true
          sudo chmod -R 755 /tmp/out
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

name: Manual Build Process (Final Final)
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build custom pmbootstrap 3.10.0 Docker image
        run: |
          docker system prune -af || true
          
          cat > Dockerfile <<EOF
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y python3 python3-pip python3-venv git openssl device-tree-compiler bmap-tools sudo curl kpartx
          RUN git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /pmbootstrap && cd /pmbootstrap && git checkout 3.10.0
          RUN python3 -m venv /pmbootstrap/venv
          RUN /pmbootstrap/venv/bin/pip install /pmbootstrap tomli
          WORKDIR /work
          CMD ["/pmbootstrap/venv/bin/pmbootstrap"]
          EOF
          
          docker build -t pmos-toolbox --no-cache .

      - name: Execute the Ultimate Build Step
        run: |
          mkdir -p /tmp/out
          
          docker run --rm -t \
            --entrypoint bash \
            --user root \
            -v ${{ github.workspace }}:/home/pmos/mi_repo \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmos-toolbox \
            -c "
              # 1. CREAR EL USUARIO Y SU HOME CON PERMISOS TOTALES
              useradd -m -d /home/pmos -s /bin/bash pmos &&
              echo 'pmos ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
              chown -R pmos:pmos /home/pmos &&
              chmod 777 /home/pmos &&

              # 2. CLONAR EL REPO OFICIAL Y ENLAZAR TU DISPOSITIVO
              git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/pmos/pmaports_clean &&
              chown -R pmos:pmos /home/pmos/pmaports_clean &&
              ln -s /home/pmos/mi_repo /home/pmos/pmaports_clean/pmaports-gts7fewifi &&

              # 3. ARCHIVO DE CONFIGURACIÓN DE PMAPORTS
              echo '[pmaports]' > /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports_clean/pmaports.cfg &&

              # 4. EL TRUCO DEFINITIVO: USAMOS /home/pmos/work SIN VOLÚMENES
              sudo -u pmos bash -c \"
                yes | /pmbootstrap/venv/bin/pmbootstrap --work /home/pmos/work init &&
                /pmbootstrap/venv/bin/pmbootstrap --work /home/pmos/work --aports /home/pmos/pmaports_clean install --no-fde &&
                /pmbootstrap/venv/bin/pmbootstrap --work /home/pmos/work --aports /home/pmos/pmaports_clean export
              \"

              # 5. COPIAR ARTEFACTOS
              cp -rv /home/pmos/work/cache_http/images/* /tmp/out/ || true;
              cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true;
            "

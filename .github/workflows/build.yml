name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl curl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap 3.9.0
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@3.9.0"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Prepare official pmaports repository
        run: |
          mkdir -p /home/runner/.local/var/pmbootstrap/cache_git
          
          # 1. Clonar el repo oficial en la ruta que pmbootstrap espera
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # 2. Configurar el remote y descargar la rama master
          cd /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
          # 3. EL TRUCO FINAL: Crear una rama local 'master' que rastree a 'origin/master'.
          # Esto hace que 'git show origin/master:channels.cfg' funcione.
          git checkout -b master --track origin/master
          
          # 4. Copiar el contenido de TU repositorio (tu dispositivo gts7fewifi) al repositorio oficial.
          # Sobrescribimos cualquier cosa y añadimos tu carpeta device.
          cp -rf ${{ github.workspace }}/* /home/runner/.local/var/pmbootstrap/cache_git/pmaports/
          
          # 5. Crear pmaports.cfg en el repositorio oficial (ya que copiamos todo)
          cat > /home/runner/.local/var/pmbootstrap/cache_git/pmaports/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 3.9.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
      - name: Build (The Absolute Final Piece)
        run: |
          # Ahora pmbootstrap encontrará 'origin/master' y el dispositivo gts7fewifi.
          # Apuntamos 'aports' directamente al repositorio clonado oficial.
          pmbootstrap \
            -c aports=/home/runner/.local/var/pmbootstrap/cache_git/pmaports \
            -c work=/tmp/pmbootstrap_work \
            -c device=gts7fewifi \
            -c channel=edge \
            -c ui=console \
            -c extra_space=1500 \
            -c jobs=2 \
            --details-to-stdout \
            install --no-fde
          
          # Exportar artefactos
          pmbootstrap \
            -c aports=/home/runner/.local/var/pmbootstrap/cache_git/pmaports \
            -c work=/tmp/pmbootstrap_work \
            export
          
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pmbootstrap-ci
        run: |
          # Esta es la herramienta oficial para CI. No instala pmbootstrap, usa contenedores ya probados.
          curl -L https://gitlab.postmarketos.org/postmarketOS/pmbootstrap-ci/-/raw/master/pmbootstrap-ci.py -o pmbootstrap-ci.py
          chmod +x pmbootstrap-ci.py
          
      - name: Build rootfs for gts7fewifi
        run: |
          ./pmbootstrap-ci.py \
            --device gts7fewifi \
            --channel edge \
            --no-fde \
            --output /tmp/out
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

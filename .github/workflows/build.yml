name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap (stable version 2.x)
        run: |
          # Instalamos la versión estable desde PyPI en lugar de clonar la 3.x (que es inestable en CI)
          pip3 install pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Manual config setup (Compatible con v2.x)
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # Configuración manual que la versión 2.x entiende perfectamente
          cat > ~/.config/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          EOF
          
          # Crear el archivo pmaports.cfg OBLIGATORIO
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
      - name: Build rootfs for gts7fewifi
        run: |
          # En v2.x, esto es suficiente y NO tiene el error de Git
          pmbootstrap init
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

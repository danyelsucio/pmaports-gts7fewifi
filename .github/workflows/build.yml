name: build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools

    - name: Install pmbootstrap from source
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
        pip3 install --user./pmbootstrap
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Initialize pmbootstrap
      run: |
        mkdir -p ~/.config/pmbootstrap
        echo -e "[pmbootstrap]\naports = ${{ github.workspace }}\nwork = /tmp/pmbootstrap_work\nis_default_channel = False" > ~/.config/pmbootstrap/pmbootstrap.cfg
        pmbootstrap --aports ${{ github.workspace }} config device gts7fewifi
        pmbootstrap --aports ${{ github.workspace }} status

    - name: Build rootfs for gts7fewifi
      run: |
        pmbootstrap --aports ${{ github.workspace }} install --no-fde --no-recommends --no-local --no-sshd --no-boot --no-extra || true
        pmbootstrap --aports ${{ github.workspace }} export
        find /tmp/postmarketOS-export -type f | head -n 100
        mkdir -p /tmp/out
        cp -r /tmp/postmarketOS-export/* /tmp/out/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pmos-gts7fewifi-image
        path: /tmp/out/

name: build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools

    - name: Install pmbootstrap from source
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
        pip3 install --user ./pmbootstrap
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Create configs manually
      run: |
        mkdir -p /tmp/pmbootstrap_work
        # Si tu repo no tiene pmaports.cfg, crealo
        if [! -f "${{ github.workspace }}/pmaports.cfg" ]; then
          echo -e "[pmaports]\nchannel = edge" > ${{ github.workspace }}/pmaports.cfg
        fi
        # Crea el config de pmbootstrap en los dos lugares donde lo busca
        mkdir -p ~/.config/pmbootstrap
        cat > ~/.config/pmbootstrap.cfg <<EOF
        [pmbootstrap]
        aports = ${{ github.workspace }}
        work = /tmp/pmbootstrap_work
        is_default_channel = False
        device = gts7fewifi
        kernel = gts7fewifi
        EOF
        cp ~/.config/pmbootstrap.cfg ~/.config/pmbootstrap/pmbootstrap.cfg
        cat ~/.config/pmbootstrap.cfg
        ls -la ${{ github.workspace }} | head -n 30
        pmbootstrap --aports ${{ github.workspace }} --work /tmp/pmbootstrap_work status || true

    - name: Build rootfs for gts7fewifi
      run: |
        pmbootstrap --aports ${{ github.workspace }} --work /tmp/pmbootstrap_work install --no-fde --no-recommends
        pmbootstrap --aports ${{ github.workspace }} --work /tmp/pmbootstrap_work export
        ls -lh /tmp/postmarketOS-export/
        mkdir -p /tmp/out
        cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pmos-gts7fewifi-image
        path: /tmp/out/

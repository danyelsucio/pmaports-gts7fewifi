name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap from source
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Pre-create valid config file to avoid init prompts
        run: |
          mkdir -p ~/.config/pmbootstrap
          
          # Generamos el archivo de configuración manualmente con el formato correcto
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 0
          jobs = 2
          EOF
          
      - name: Initialize pmbootstrap config
        run: |
          mkdir -p /tmp/pmbootstrap_work
          cd ${{ github.workspace }}
          
          # Ahora ejecutamos 'init'. Como el archivo de configuración ya existe
          # y tiene todas las respuestas, no preguntará nada y no fallará.
          pmbootstrap init
          
      - name: Build rootfs for gts7fewifi
        run: |
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

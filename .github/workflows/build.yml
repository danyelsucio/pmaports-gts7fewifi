name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap from source
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Initialize pmbootstrap config (Fixes format error)
        run: |
          mkdir -p /tmp/pmbootstrap_work
          cd ${{ github.workspace }}
          
          # Configure git remote for pmaports
          git remote add origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git 2>/dev/null || git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin main --depth 1 || git fetch origin master --depth 1
          
          # Generate the new config using pmbootstrap init (non-interactive)
          # This writes the correct format required by v3.11.1
          pmbootstrap init --yes \
            --aports ${{ github.workspace }} \
            --work /tmp/pmbootstrap_work \
            --device gts7fewifi \
            --channel edge \
            --no-fde
            
      - name: Build rootfs for gts7fewifi
        run: |
          # Config is already set, just run the commands
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl curl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@main"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Configure environment and build
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          mkdir -p /tmp/git_pmaports
          
          # 1. Clonar el repositorio oficial de pmaports en una carpeta temporal.
          # Esto es lo que pmbootstrap espera encontrar.
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/git_pmaports
          
          # 2. Crear un enlace simbólico (acceso directo) en tu espacio de trabajo hacia el clon oficial.
          # Cuando pmbootstrap intente leer "origin/main", verá la carpeta oficial en lugar de tu fork.
          ln -s /tmp/git_pmaports ${{ github.workspace }}/pmaports
          
          # 3. Crear el archivo de configuración completo (apuntando al enlace simbólico)
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}/pmaports
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          # 4. (Opcional) Mantener tu pmaports.cfg local para el dispositivo
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 5. EL TRUCO FINAL: Respondemos al work path por adelantado y ejecutamos el install.
          echo "/tmp/pmbootstrap_work" | pmbootstrap --aports ${{ github.workspace }}/pmaports --details-to-stdout install --no-fde
          
          # 6. Exportar los artefactos
          pmbootstrap export
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

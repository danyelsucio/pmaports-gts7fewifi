name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap from source
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Config setup and create pmaports.cfg
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # Crear el archivo de configuración de pmbootstrap
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 0
          jobs = 2
          EOF
          
          # Crear el archivo pmaports.cfg OBLIGATORIO en la raíz
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # Simular que el init ya pasó
          touch ~/.config/pmbootstrap/pmbootstrap_init_done
          
      - name: Build rootfs for gts7fewifi
        env:
          PMBOOTSTRAP_APORTS: ${{ github.workspace }}
        run: |
          # Usamos la variable de entorno para evitar errores de Git.
          # Ahora pmbootstrap usará la carpeta local sin intentar hacer fetch.
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

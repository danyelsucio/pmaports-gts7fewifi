name: Build postmarketOS Image (Official Container)
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build using official pmbootstrap container
        run: |
          mkdir -p /tmp/out
          
          # Ejecutamos el contenedor oficial y le pasamos 'yes' para responder a todas las preguntas
          docker run --rm -t \
            --entrypoint bash \
            -v ${{ github.workspace }}:/home/pmos/pmaports \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            ghcr.io/postmarketos/pmbootstrap:latest \
            -c "
              # Configurar el archivo pmaports.cfg con el dispositivo
              echo '[pmaports]' > /home/pmos/pmaports/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports/pmaports.cfg &&

              # Usamos 'yes' para responder a TODAS las preguntas del init
              yes | pmbootstrap --aports /home/pmos/pmaports init &&
              
              # Instalar y exportar
              pmbootstrap --aports /home/pmos/pmaports install --no-fde &&
              pmbootstrap --aports /home/pmos/pmaports export &&
              
              # Copiar los artefactos
              cp -rv /home/pmos/.local/var/pmbootstrap/cache_http/images/* /tmp/out/ || true
            "
      
      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

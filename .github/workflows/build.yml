name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          # Instalamos la rama main (3.11.1)
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@main"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Configure environment and build
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          CONFIG_FILE="$HOME/.config/pmbootstrap/pmbootstrap.cfg"
          APORTS_DIR="${{ github.workspace }}"
          WORK_DIR="/tmp/pmbootstrap_work"
          
          # 1. Crear el archivo de configuración completo
          cat > "$CONFIG_FILE" <<EOF
          [pmbootstrap]
          aports = $APORTS_DIR
          work = $WORK_DIR
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          # 2. Crear pmaports.cfg
          cat > "$APORTS_DIR/pmaports.cfg" <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 3. Arreglar Git para que no se queje de remotes
          cd "$APORTS_DIR"
          git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
          # 4. EL TRUCO MAESTRO:
          #   a) Usamos echo para responder a la pregunta del "Work path" (si aparece) y evitar el EOF.
          #   b) NO ejecutamos 'init'. Usamos directamente 'install --config'.
          #   c) Usamos '--details-to-stdout' (que SÍ existe en 3.11.1) para evitar timeouts.
          echo "$WORK_DIR" | pmbootstrap --config "$CONFIG_FILE" install --no-fde --details-to-stdout
          
          # 5. Exportar los archivos generados
          pmbootstrap --config "$CONFIG_FILE" export
          
          # 6. Mover los artefactos
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

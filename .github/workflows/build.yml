name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl curl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap 3.9.0
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@3.9.0"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Prepare directories and symlinks
        run: |
          mkdir -p /home/runner/.local/var/pmbootstrap/cache_git
          
          # Clonamos el repo oficial en la ruta que pmbootstrap espera
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # EL TRUCO DEFINITIVO: Configuramos el remote 'origin' para que apunte a master
          cd /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          git remote add origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
          # Enlazar tu repositorio al oficial
          mkdir -p ${{ github.workspace }}/pmaports
          ln -s /home/runner/.local/var/pmbootstrap/cache_git/pmaports/* ${{ github.workspace }}/pmaports/
          
          # Crear pmaports.cfg
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 3.9.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
      - name: Build (The Absolute Last Piece)
        run: |
          # Ahora pmbootstrap encontrará 'origin/master' en el remote y no fallará.
          pmbootstrap \
            -c aports=${{ github.workspace }}/pmaports \
            -c work=/tmp/pmbootstrap_work \
            -c device=gts7fewifi \
            -c channel=edge \
            -c ui=console \
            -c extra_space=1500 \
            -c jobs=2 \
            --details-to-stdout \
            install --no-fde
          
          # Exportar artefactos
          pmbootstrap \
            -c aports=${{ github.workspace }}/pmaports \
            -c work=/tmp/pmbootstrap_work \
            export
          
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

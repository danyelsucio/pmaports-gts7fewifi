name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap v2.3.0 (Stable for CI)
        run: |
          # Instalamos la versión 2.3.0 estable usando el nombre correcto del paquete de PyPI
          pip3 install postmarketos-pmbootstrap==2.3.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Manual config setup
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # Crear configuración compatible con v2.x
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 0
          jobs = 2
          EOF
          
          # Crear el archivo pmaports.cfg obligatorio en la raíz del repo
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
      - name: Build rootfs for gts7fewifi
        run: |
          # Con la v2.3.0, esto funcionará sin errores de Git ni de init
          pmbootstrap init
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

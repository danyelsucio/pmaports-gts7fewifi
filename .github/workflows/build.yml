name: Build T733
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: my-ports
      - name: Build Image
        run: |
          sudo apt update && sudo apt install -y git openssl parted qemu-user-static
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          cp -rv my-ports/device/testing/* pmaports/device/testing/
          cd pmbootstrap
          ./pmbootstrap.py config aports $GITHUB_WORKSPACE/pmaports
          ./pmbootstrap.py config device samsung-gts7fewifi
          ./pmbootstrap.py config ui plasma-mobile
          ./pmbootstrap.py config work /tmp/pmbootstrap
          ./pmbootstrap.py zap -p
          echo -e "y\n" | ./pmbootstrap.py -y init
          ./pmbootstrap.py install --fde --no-sshd
          ./pmbootstrap.py export
          ls -lh /tmp/postmarketOS-export/
      - name: Upload IMG
        uses: actions/upload-artifact@v4
        with:
          name: gts7fewifi-img
          path: /tmp/postmarketOS-export/*

name: Manual Build Process
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the Base Toolbox Container
        run: |
          docker build -t pmos-toolbox .

      - name: Execute the Step-by-Step Build Process
        run: |
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          docker run --rm -t \
            --entrypoint bash \
            -v ${{ github.workspace }}:/home/pmos/pmaports \
            -v /tmp/pmbootstrap_work:/home/pmos/.local/var/pmbootstrap \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmos-toolbox \
            -c "
              # 1. CREAR EL USUARIO Y PERMISOS
              mkdir -p /build &&
              chmod 777 /build &&
              useradd -m -d /build -s /bin/bash pmos &&
              echo 'pmos ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
              chown -R pmos:pmos /home/pmos/pmaports &&
              chown -R pmos:pmos /home/pmos/.local/var/pmbootstrap &&
              chown -R pmos:pmos /tmp/out &&
              chown -R pmos:pmos /build &&

              sudo -u pmos bash -c \"
                echo '--- PASO 1: CONFIGURAR EL ENTORNO ---';
                echo '[pmaports]' > /home/pmos/pmaports/pmaports.cfg;
                echo 'version = 7' >> /home/pmos/pmaports/pmaports.cfg;
                echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports/pmaports.cfg;
                echo 'channel = edge' >> /home/pmos/pmaports/pmaports.cfg;

                echo '--- PASO 2: DESCARGAR E INSTALAR PMBOOTSTRAP ---';
                git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /build/pmbootstrap_src &&
                python3 -m venv /build/venv &&
                /build/venv/bin/pip install /build/pmbootstrap_src tomli;

                echo '--- PASO 3: PREPARAR LA CONFIGURACIÓN DEL DISPOSITIVO ---';
                mkdir -p /build/.config/pmbootstrap;
                echo '[pmbootstrap]' > /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'aports = /home/pmos/pmaports' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'work = /home/pmos/.local/var/pmbootstrap' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'device = gts7fewifi' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'channel = edge' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'ui = console' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'extra_space = 1500' >> /build/.config/pmbootstrap/pmbootstrap.cfg;

                echo '--- PASO 4: EL TRUCO DEFINITIVO (Descarga manual de channels.cfg) ---';
                cd /home/pmos/pmaports;
                git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git;
                git fetch origin master --depth 1;
                # Descargamos el archivo directamente y lo ponemos en la raíz
                curl -L https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/master/channels.cfg -o /home/pmos/pmaports/channels.cfg;
                # Creamos una referencia vacía para engañar a pmbootstrap
                mkdir -p .git/refs/remotes/origin;
                echo '0000000000000000000000000000000000000000' > .git/refs/remotes/origin/main;

                echo '--- PASO 5: COMPILAR (INSTALL) ---';
                /build/venv/bin/pmbootstrap --config /build/.config/pmbootstrap/pmbootstrap.cfg install --no-fde;

                echo '--- PASO 6: EXPORTAR LA IMAGEN ---';
                /build/venv/bin/pmbootstrap --config /build/.config/pmbootstrap/pmbootstrap.cfg export;

                echo '--- PASO 7: COPIAR ARTEFACTOS ---';
                cp -rv /home/pmos/.local/var/pmbootstrap/cache_http/images/* /tmp/out/ || true;
                cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true;
              \"
            "

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

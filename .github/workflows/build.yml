name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build custom pmbootstrap Docker image
        run: |
          docker build -t pmbootstrap-local .
          
      - name: Run build using local image
        run: |
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          docker run --rm -t \
            -v ${{ github.workspace }}:/home/pmos/pmaports \
            -v /tmp/pmbootstrap_work:/home/pmos/.local/var/pmbootstrap \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmbootstrap-local \
            sh -c "
              echo '[pmaports]' > /home/pmos/pmaports/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports/pmaports.cfg &&
              
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap init --yes --device gts7fewifi --channel edge &&
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap install --no-fde &&
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap export
            "
          
          cp -rv /tmp/pmbootstrap_work/cache_http/images/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap v3.1.0
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git -b 3.1.0 --depth 1
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Create config files
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          cd ${{ github.workspace }}
          git remote set-url origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch origin master --depth 1
          
      - name: Build rootfs for gts7fewifi
        run: |
          # EL TRUCO DEFINITIVO: Usamos --config para cargar el archivo manual y saltarnos el init por completo.
          # Esto evita los errores de EOF y el argumento --yes.
          pmbootstrap --config ~/.config/pmbootstrap/pmbootstrap.cfg install --no-fde --details-to-stdout
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

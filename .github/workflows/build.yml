name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap (Branch 2.x - Stable for CI)
        run: |
          # Clonamos y nos vamos directamente a la rama 2.x (que no tiene los bugs de Git)
          git clone -b 2.x https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --user ./pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Configure pmbootstrap and build rootfs
        run: |
          # 1. Crear directorios de configuración
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # 2. Crear el archivo de configuración principal
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          EOF
          
          # 3. Crear el archivo pmaports.cfg obligatorio en la raíz
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 4. Simular que el init ya se ejecutó para evitar preguntas
          touch ~/.config/pmbootstrap/pmbootstrap_init_done
          
          # 5. Ejecutar la compilación
          pmbootstrap init
          pmbootstrap install --no-fde
          pmbootstrap export
          
          # 6. Copiar los artefactos
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

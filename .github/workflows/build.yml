name: Manual Build Process (Final Device Fix - REAL)
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build custom pmbootstrap Docker image
        run: |
          docker system prune -af || true
          cat > Dockerfile <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y python3 python3-pip python3-venv git openssl device-tree-compiler bmap-tools sudo curl kpartx qemu-user-static
          RUN git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /pmbootstrap
          RUN python3 -m venv /pmbootstrap/venv
          RUN /pmbootstrap/venv/bin/pip install /pmbootstrap tomli
          WORKDIR /work
          CMD ["/pmbootstrap/venv/bin/pmbootstrap"]
          EOF
          docker build -t pmos-toolbox.

      - name: Execute the Ultimate Build Step
        run: |
          mkdir -p /tmp/out
          chmod 777 /tmp/out
          docker run --rm -t \
            --entrypoint bash \
            --user root \
            -v ${{ github.workspace }}:/home/pmos/mi_repo \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmos-toolbox \
            -c "
              set -e
              mkdir -p /build && chmod 777 /build
              id pmos || useradd -m -d /build -s /bin/bash pmos
              echo 'pmos ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              chown -R pmos:pmos /tmp/out /build

              rm -rf /home/pmos/pmaports_clean
              git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/pmos/pmaports_clean
              mkdir -p /home/pmos/pmaports_clean/device/testing/
              rm -rf /home/pmos/pmaports_clean/device/testing/device-samsung-gts7fewifi
              cp -r /home/pmos/mi_repo /home/pmos/pmaports_clean/device/testing/device-samsung-gts7fewifi
              chown -R pmos:pmos /home/pmos/pmaports_clean

              echo '[pmaports]' > /home/pmos/pmaports_clean/pmaports.cfg
              echo 'version = 7' >> /home/pmos/pmaports_clean/pmaports.cfg
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports_clean/pmaports.cfg
              echo 'channel = edge' >> /home/pmos/pmaports_clean/pmaports.cfg

              sudo -u pmos bash -c '
                set -x
                rm -rf /build/.config /build/.local /tmp/pmos_work
                mkdir -p /tmp/pmos_work

                # FIX: ENTER infinito para que no de EOF
                yes \"\" | /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work init || true

                # Forzamos TU device despues del init
                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work config device gts7fewifi
                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work config ui console
                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work config extra_space 1500

                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work install --no-fde
                /pmbootstrap/venv/bin/pmbootstrap --aports /home/pmos/pmaports_clean --work /tmp/pmos_work export
              '
              find /tmp/pmos_work -type f \( -name '*.img' -o -name '*.zip' \) -exec cp -v {} /tmp/out/ \; 2>/dev/null || true
              cp -rv /tmp/postmarketOS-export/* /tmp/out/ 2>/dev/null || true
              ls -lhR /tmp/out/
            "

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

name: Manual Build Process (KO Técnico)
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build custom pmbootstrap Docker image (with tomli and kpartx)
        run: |
          docker system prune -af || true
          
          cat > Dockerfile <<EOF
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y python3 python3-pip python3-venv git openssl device-tree-compiler bmap-tools sudo curl kpartx
          RUN git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /pmbootstrap
          RUN python3 -m venv /pmbootstrap/venv
          RUN /pmbootstrap/venv/bin/pip install /pmbootstrap tomli
          WORKDIR /work
          CMD ["/pmbootstrap/venv/bin/pmbootstrap"]
          EOF
          
          docker build -t pmos-toolbox --no-cache .

      - name: Execute the Ultimate Build Step
        run: |
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          
          docker run --rm -t \
            --entrypoint bash \
            -v ${{ github.workspace }}:/home/pmos/mi_repo \
            -v /tmp/pmbootstrap_work:/home/pmos/.local/var/pmbootstrap \
            -v /tmp/out:/tmp/out \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            pmos-toolbox \
            -c "
              # 1. CREAR EL USUARIO Y PERMISOS
              mkdir -p /build &&
              chmod 777 /build &&
              useradd -m -d /build -s /bin/bash pmos &&
              echo 'pmos ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
              chown -R pmos:pmos /tmp/out &&
              chown -R pmos:pmos /build &&

              # 2. CLONAR EL REPO OFICIAL Y DAR PERMISOS
              git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/pmos/pmaports_clean &&
              chown -R pmos:pmos /home/pmos/pmaports_clean &&
              ln -s /home/pmos/mi_repo /home/pmos/pmaports_clean/pmaports-gts7fewifi &&

              # 3. CREAR pmaports.cfg EN EL CLON
              echo '[pmaports]' > /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports_clean/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports_clean/pmaports.cfg &&

              # 4. EJECUTAR TODO COMO pmos (INCLUYENDO EL BORRADO DE LA CACHÉ)
              sudo -u pmos bash -c \"
                # LIMPIEZA DE CACHÉ (Ahora pmos puede borrarla sin bloqueos)
                rm -rf /home/pmos/.local/var/pmbootstrap;

                mkdir -p /build/.config/pmbootstrap;
                echo '[pmbootstrap]' > /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'aports = /home/pmos/pmaports_clean' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'work = /home/pmos/.local/var/pmbootstrap' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'device = gts7fewifi' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'channel = edge' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'ui = console' >> /build/.config/pmbootstrap/pmbootstrap.cfg;
                echo 'extra_space = 1500' >> /build/.config/pmbootstrap/pmbootstrap.cfg;

                # INSTALACIÓN
                /pmbootstrap/venv/bin/pmbootstrap --config /build/.config/pmbootstrap/pmbootstrap.cfg install --no-fde;

                # EXPORTACIÓN
                /pmbootstrap/venv/bin/pmbootstrap --config /build/.config/pmbootstrap/pmbootstrap.cfg export;
              \"

              # 5. COPIAR ARTEFACTOS
              cp -rv /home/pmos/.local/var/pmbootstrap/cache_http/images/* /tmp/out/ || true;
              cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true;
            "

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

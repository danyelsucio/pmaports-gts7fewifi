name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv git openssl curl device-tree-compiler bmap-tools
          
      - name: Setup Python venv and install pmbootstrap 3.4.0
        run: |
          python3 -m venv venv
          source venv/bin/activate
          
          # Instalamos la versión 3.4.0 (que tiene todos los flags y no está rota)
          pip install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git@3.4.0"
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          
      - name: Configure and build (Skipping broken 'init' entirely)
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          mkdir -p /tmp/out
          mkdir -p /tmp/git_pmaports
          
          # 1. Clonar el repositorio oficial de pmaports (para evitar el error de Git)
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/git_pmaports
          
          # 2. Crear el enlace simbólico necesario
          ln -s /tmp/git_pmaports ${{ github.workspace }}/pmaports
          
          # 3. Crear el archivo de configuración (Apuntando al enlace)
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}/pmaports
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          extra_space = 1500
          jobs = 2
          EOF
          
          # 4. Crear pmaports.cfg en la raíz de los aports
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # 5. EL TRUCO FINAL: Usamos --config y nos saltamos el 'init' por completo.
          # La versión 3.4.0 tiene el flag --details-to-stdout
          pmbootstrap --config ~/.config/pmbootstrap/pmbootstrap.cfg --details-to-stdout install --no-fde
          
          # 6. Exportar los artefactos
          pmbootstrap --config ~/.config/pmbootstrap/pmbootstrap.cfg export
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

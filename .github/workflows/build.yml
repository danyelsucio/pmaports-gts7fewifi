name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bmap-tools
          
      - name: Build rootfs using official pmbootstrap Docker image
        run: |
          # Nos aseguramos de tener los permisos correctos para compartir la carpeta
          chmod -R 755 ${{ github.workspace }}
          
          # Ejecutamos pmbootstrap dentro del contenedor oficial.
          # Esto evita TODOS los bugs de instalación y de ramas eliminadas.
          docker run --rm -ti \
            -v ${{ github.workspace }}:/home/pmos/pmaports \
            -v /tmp/pmbootstrap_work:/home/pmos/.local/var/pmbootstrap \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            registry.gitlab.com/postmarketos/pmbootstrap:latest \
            sh -c "
              echo '[pmaports]' > /home/pmos/pmaports/pmaports.cfg &&
              echo 'version = 7' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'pmbootstrap_min_version = 1.29.0' >> /home/pmos/pmaports/pmaports.cfg &&
              echo 'channel = edge' >> /home/pmos/pmaports/pmaports.cfg &&
              
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap init --yes &&
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap install --no-fde --device gts7fewifi &&
              pmbootstrap --aports /home/pmos/pmaports --work /home/pmos/.local/var/pmbootstrap export
            "
          
          # Copiar el resultado al directorio de salida
          mkdir -p /tmp/out
          # Buscamos la imagen exportada en el directorio de trabajo compartido
          sudo cp -rv /tmp/pmbootstrap_work/cache_http/images/* /tmp/out/ || true
          sudo chmod -R 755 /tmp/out
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/

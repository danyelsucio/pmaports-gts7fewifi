name: build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git openssl device-tree-compiler bmap-tools
          
      - name: Install pmbootstrap v2.2.1 (Última estable 2.x)
        run: |
          # Clonamos el repo y nos cambiamos a la última versión estable 2.x que funciona en CI
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          git checkout v2.2.1
          pip3 install --user .
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Create config and pmaports.cfg
        run: |
          mkdir -p ~/.config/pmbootstrap
          mkdir -p /tmp/pmbootstrap_work
          
          # Configuración para v2.2.1
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          aports = ${{ github.workspace }}
          work = /tmp/pmbootstrap_work
          device = gts7fewifi
          channel = edge
          ui = console
          EOF
          
          # Archivo obligatorio en la raíz
          cat > ${{ github.workspace }}/pmaports.cfg <<EOF
          [pmaports]
          version = 7
          pmbootstrap_min_version = 1.29.0
          channel = edge
          supported_root_filesystems = ext4,f2fs,btrfs
          EOF
          
          # Para que no pregunte nada al hacer init
          touch ~/.config/pmbootstrap/pmbootstrap_init_done
          
      - name: Build rootfs for gts7fewifi
        run: |
          # Con v2.2.1 y el archivo init_done creado, esto pasará volando
          pmbootstrap init
          pmbootstrap install --no-fde
          pmbootstrap export
          
          mkdir -p /tmp/out
          cp -rv /tmp/postmarketOS-export/* /tmp/out/ || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gts7fewifi-image
          path: /tmp/out/
